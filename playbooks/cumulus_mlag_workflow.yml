---
- name: Verify Connectivity and Facts
  hosts: leaf1,leaf2
  gather_facts: false
  tasks:
    - name: Check connectivity
      ping:
      ignore_unreachable: true
      register: ping_result

    - name: Fail if unreachable
      fail:
        msg: "Switch is unreachable. Cannot proceed."
      when: ping_result.unreachable is defined and ping_result.unreachable

    - name: Gather Facts
      setup:
      when: ping_result.unreachable is not defined or not ping_result.unreachable
- name: Pre-check and Setup
  hosts: leaf1,leaf2
  gather_facts: false
  tasks:
    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: check_mlag

- name: Set Initial Priorities (Leaf 1 Primary, Leaf 2 Secondary)
  hosts: leaf1,leaf2
  gather_facts: false
  serial: 1
  tasks:
    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: set_priority
      vars:
        new_priority: 4096
      when: 
        - mlag_present | default(false)
        - inventory_hostname == 'leaf1'
        - hostvars['leaf2']['upgrade_needed'] | default(false)

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: set_priority
      vars:
        new_priority: 8192
      when: 
        - mlag_present | default(false)
        - inventory_hostname == 'leaf2'
        - upgrade_needed | default(false)

- name: Upgrade Leaf 2 (Secondary)
  hosts: leaf2
  gather_facts: false
  tasks:
    - name: Record Start Time (Leaf 2)
      command: date +%s
      register: leaf2_start_time
      delegate_to: localhost
      changed_when: false

    - name: Log Start Time (Leaf 2)
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - Starting Upgrade for Leaf 2" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: isolate
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false)

    - name: Verify Traffic on Leaf 1
      include_role:
        name: cumulus_mlag_upgrade
        tasks_from: verify_traffic
        apply:
          delegate_to: leaf1
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false)

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: upgrade
      when: upgrade_needed | default(false)

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: restore
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false) or needs_restore | default(false)

    - name: Record End Time (Leaf 2)
      command: date +%s
      register: leaf2_end_time
      delegate_to: localhost
      changed_when: false

    - name: Log End Time and Duration (Leaf 2)
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - Finished Upgrade for Leaf 2" >> {{ log_file }}
        echo "Duration: {{ leaf2_end_time.stdout | int - leaf2_start_time.stdout | int }} seconds" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost

- name: Swap Roles (Leaf 2 Primary, Leaf 1 Secondary)
  hosts: leaf2
  gather_facts: false
  tasks:
    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: set_priority
      vars:
        new_priority: 2048
      when: 
        - mlag_present | default(false)
        - hostvars['leaf1']['upgrade_needed'] | default(false)

- name: Upgrade Leaf 1 (Secondary)
  hosts: leaf1
  gather_facts: false
  tasks:
    - name: Record Start Time (Leaf 1)
      command: date +%s
      register: leaf1_start_time
      delegate_to: localhost
      changed_when: false

    - name: Log Start Time (Leaf 1)
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - Starting Upgrade for Leaf 1" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: isolate
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false)

    - name: Verify Traffic on Leaf 2
      include_role:
        name: cumulus_mlag_upgrade
        tasks_from: verify_traffic
        apply:
          delegate_to: leaf2
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false)

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: upgrade
      when: upgrade_needed | default(false)

    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: restore
      when: 
        - mlag_present | default(false)
        - upgrade_needed | default(false) or needs_restore | default(false)

    - name: Record End Time (Leaf 1)
      command: date +%s
      register: leaf1_end_time
      delegate_to: localhost
      changed_when: false

    - name: Log End Time and Duration (Leaf 1)
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - Finished Upgrade for Leaf 1" >> {{ log_file }}
        echo "Duration: {{ leaf1_end_time.stdout | int - leaf1_start_time.stdout | int }} seconds" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost

- name: Revert Priorities
  hosts: cumulus
  gather_facts: false
  tasks:
    - include_role:
        name: cumulus_mlag_upgrade
        tasks_from: set_priority
      vars:
        new_priority: "{{ original_mlag_priority }}"
      when: mlag_present | default(false)

    - name: Record Workflow End Time
      command: date +%s
      register: workflow_end_time
      delegate_to: localhost
      changed_when: false
      run_once: true

    - name: Log Overall Duration
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - Workflow Completed" >> {{ log_file }}
        echo "Total Workflow Duration: {{ workflow_end_time.stdout | int - hostvars[inventory_hostname]['ansible_date_time']['epoch'] | int }} seconds" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost
      when: log_file is defined
