---
- name: Verify Switch Role is Secondary
  command: nv show mlag -o json
  register: mlag_role_check
  changed_when: false
  when: mlag_present | default(false)

- name: Fail if not Secondary (and MLAG is present)
  fail:
    msg: "Switch is not in Secondary role. Aborting upgrade."
  when: 
    - mlag_present | default(false)
    - (mlag_role_check.stdout | from_json)['local-role'] != "secondary"

- name: Record Upgrade Start Time
  command: date +%s
  register: upgrade_start_time
  delegate_to: localhost
  changed_when: false
  when: upgrade_needed

- name: Perform dist-upgrade
  command: apt-get dist-upgrade -y
  register: upgrade_output
  when: upgrade_needed

- name: Record Upgrade End Time
  command: date +%s
  register: upgrade_end_time
  delegate_to: localhost
  changed_when: false
  when: upgrade_needed

- name: Log Upgrade Duration
  shell: |
    echo "==================================================" >> {{ log_file }}
    echo "{{ ansible_date_time.iso8601 }} - Upgrade Duration: {{ ((upgrade_end_time.stdout | int - upgrade_start_time.stdout | int) / 3600) | int }}h {{ (((upgrade_end_time.stdout | int - upgrade_start_time.stdout | int) % 3600) / 60) | int }}m" >> {{ log_file }}
    echo "==================================================" >> {{ log_file }}
  delegate_to: localhost
  when: upgrade_needed

- name: Log Upgrade Output
  block:
    - name: Write upgrade output to temp file
      copy:
        content: |
          ==================================================
          {{ ansible_date_time.iso8601 }} - Upgrade Output:
          {{ upgrade_output.stdout | default(upgrade_output.msg) }}
          {{ upgrade_output.stderr | default('') }}
          ==================================================
        dest: "{{ log_file }}.tmp"
      delegate_to: localhost

    - name: Append temp file to log file
      shell: "cat {{ log_file }}.tmp >> {{ log_file }} && rm {{ log_file }}.tmp"
      delegate_to: localhost
  when: upgrade_needed and (upgrade_output.failed or upgrade_output.changed)

- name: Fail if upgrade failed
  fail:
    msg: "Upgrade failed. Check log for details."
  when: upgrade_needed and upgrade_output.failed

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: upgrade_needed

- name: Record Reboot Start Time
  command: date +%s
  register: reboot_start_time
  delegate_to: localhost
  changed_when: false
  when: upgrade_needed and (reboot_required_file.stat.exists or upgrade_output.changed)

- name: Reboot the switch
  reboot:
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
  when: upgrade_needed and (reboot_required_file.stat.exists or upgrade_output.changed)

- name: Wait for switch to return
  wait_for_connection:
    delay: 60
    timeout: 600
  when: upgrade_needed and (reboot_required_file.stat.exists or upgrade_output.changed)

- name: Get installed version of cumulus-platform (Post-Upgrade)
  shell: apt-cache policy cumulus-platform | grep Installed | awk '{print $2}'
  register: installed_version_post
  changed_when: false
  check_mode: false
  when: upgrade_needed and (reboot_required_file.stat.exists or upgrade_output.changed)

- name: Log versions (Final Verification)
  shell: |
    echo "{{ ansible_date_time.iso8601 }} - Final Verification:" >> {{ log_file }}
    echo "Installed version: {{ installed_version_post.stdout }}" >> {{ log_file }}
    echo "Candidate version: {{ candidate_version.stdout }}" >> {{ log_file }}
  delegate_to: localhost
  when: upgrade_needed and (reboot_required_file.stat.exists or upgrade_output.changed)
