---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- #name: Set log file path
  #set_fact:
  #  log_file: "/home/admin/upgrade_log_{{ inventory_hostname }}_{{ ansible_date_time.iso8601 }}.txt"

- name: Create log file
  copy:
    content: "Upgrade Log for {{ inventory_hostname }} - {{ ansible_date_time.iso8601 }}\n--------------------------------------------------\n"
    dest: "{{ log_file }}"
  delegate_to: localhost

- name: Get installed version of cumulus-platform
  shell: apt-cache policy cumulus-platform | grep Installed | awk '{print $2}'
  register: installed_version
  changed_when: false
  check_mode: false

- name: Get candidate version of cumulus-platform
  shell: apt-cache policy cumulus-platform | grep Candidate | awk '{print $2}'
  register: candidate_version
  changed_when: false
  check_mode: false

- name: Log versions
  shell: |
    echo "==================================================" >> {{ log_file }}
    echo "{{ ansible_date_time.iso8601 }} - Installed version: {{ installed_version.stdout }}" >> {{ log_file }}
    echo "{{ ansible_date_time.iso8601 }} - Candidate version: {{ candidate_version.stdout }}" >> {{ log_file }}
    echo "==================================================" >> {{ log_file }}
  delegate_to: localhost

- name: Check if upgrade is required
  set_fact:
    upgrade_needed: "{{ installed_version.stdout != candidate_version.stdout and candidate_version.stdout != '' }}"

- name: Log upgrade status
  shell: |
    echo "==================================================" >> {{ log_file }}
    echo "{{ ansible_date_time.iso8601 }} - Upgrade required: {{ upgrade_needed }}" >> {{ log_file }}
    echo "==================================================" >> {{ log_file }}
  delegate_to: localhost

- name: MLAG Checks
  block:
    - name: Check MLAG status
      command: nv show mlag -o json
      register: mlag_status_json
      ignore_errors: true
      changed_when: false

    - name: Parse MLAG status
      set_fact:
        mlag_data: "{{ mlag_status_json.stdout | from_json }}"
      when: mlag_status_json.rc == 0

    - name: Set MLAG present fact
      set_fact:
        mlag_present: "{{ mlag_status_json.rc == 0 and mlag_data is defined }}"

    - name: Fail if MLAG is not present
      fail:
        msg: "MLAG is not configured on this switch. Exiting execution."
      when: not mlag_present

    - name: Get current MLAG priority
      set_fact:
        original_mlag_priority: "{{ mlag_data.priority | default(32768) }}"
      when: mlag_present

    - name: Verify MLAG consistency
      command: nv show mlag consistency
      register: mlag_consistency
      when: mlag_present
      changed_when: false

    - name: Log MLAG consistency
      shell: |
        echo "==================================================" >> {{ log_file }}
        echo "{{ ansible_date_time.iso8601 }} - MLAG Consistency:" >> {{ log_file }}
        echo "{{ mlag_consistency.stdout }}" >> {{ log_file }}
        echo "==================================================" >> {{ log_file }}
      delegate_to: localhost
      when: mlag_present

    - name: Get Interface Status
      command: nv show interface -o json
      register: interface_status_json
      changed_when: false
      when: mlag_present

    - name: Parse Interface Status
      set_fact:
        interface_data: "{{ interface_status_json.stdout | from_json }}"
      when: mlag_present

    - name: Identify Bond Interfaces and Peerlink
      set_fact:
        # Filter interfaces where type is 'bond' and mlag is enabled/configured.
        # Note: The exact JSON structure for 'mlag' on an interface might vary.
        # We look for interfaces that have 'bond' type and potentially 'mlag' key.
        # For peerlink, we look for 'peerlink' in the name or specific mlag settings if available.
        # Assuming standard naming convention or 'peerlink' property if available.
        # If 'peerlink' is not explicitly flagged, we might need to rely on 'nv show mlag' for that specific one,
        # but user asked to use 'nv show interface'.
        # Let's try to find peerlink by name 'peerlink' or if it has 'mlag.peerlink' property.
        # And other bonds are those with 'bond' type but not the peerlink.
        
        # Strategy:
        # 1. Get all interfaces.
        # 2. Filter for bonds: usually keys in interface_data where 'type' == 'bond' (or similar).
        # 3. Peerlink is often named 'peerlink'.
        
        # We will assume interface_data is a dictionary where keys are interface names.
        # Or it might be a list. 'nv show interface -o json' usually returns a dict or list.
        # Based on typical NVUE, it's often a dict keyed by interface name.
        
        mlag_bonds: >-
          {{
            interface_data | dict2items | 
            selectattr('value.type', 'defined') |
            selectattr('value.type', 'equalto', 'bond') |
            rejectattr('key', 'equalto', 'peerlink') |
            map(attribute='key') | list
          }}
        peerlink: "{{ mlag_data['peer-interface'] | default('peerlink') }}"
        active_swp_interfaces: >-
          {{
            interface_data | dict2items |
            selectattr('key', 'match', '^swp') |
            rejectattr('key', 'equalto', 'eth0') |
            rejectattr('key', 'equalto', 'mgmt') |
            selectattr('value.link.oper-status', 'defined') |
            selectattr('value.link.oper-status', 'equalto', 'up') |
            map(attribute='key') | list
          }}
        bond_members: >-
          {{
            interface_data.values() |
            selectattr('bond.member', 'defined') |
            map(attribute='bond.member') |
            map('keys') |
            flatten |
            list
          }}
      when: mlag_present

    - name: Check for Isolated State (Recovery Mode)
      block:
        - name: Check Peerlink Admin Status
          set_fact:
            peerlink_down: "{{ interface_data[peerlink]['link']['admin-status'] == 'down' }}"
          when: peerlink is defined and interface_data[peerlink] is defined

        - name: Recover from Isolation (Bring Up Peerlink Only)
          block:
            - name: Log Recovery Action
              shell: |
                echo "==================================================" >> {{ log_file }}
                echo "{{ ansible_date_time.iso8601 }} - Peerlink {{ peerlink }} is down. Bringing up Peerlink for recovery/sync." >> {{ log_file }}
                echo "==================================================" >> {{ log_file }}
              delegate_to: localhost

            - name: Bring up Peerlink
              command: "nv set interface {{ peerlink }} link state up"
            
            - name: Apply Config (Recovery)
              command: nv config apply
              register: recovery_apply
              until: recovery_apply.rc == 0
              retries: 3
              delay: 10

            - name: Wait for MLAG Sync (Recovery)
              pause:
                seconds: 60

            - name: Refresh MLAG Status
              command: nv show mlag -o json
              register: mlag_status_refreshed
              changed_when: false

            - name: Update MLAG Data
              set_fact:
                mlag_data: "{{ mlag_status_refreshed.stdout | from_json }}"

            - name: Verify MLAG Consistency (Post-Recovery)
              command: nv show mlag consistency
              register: mlag_consistency_recovery
              changed_when: false

            - name: Log MLAG Consistency (Post-Recovery)
              shell: |
                echo "==================================================" >> {{ log_file }}
                echo "{{ ansible_date_time.iso8601 }} - MLAG Consistency (Post-Recovery):" >> {{ log_file }}
                echo "{{ mlag_consistency_recovery.stdout }}" >> {{ log_file }}
                echo "==================================================" >> {{ log_file }}
              delegate_to: localhost
          when: peerlink_down | default(false)

    - name: Check if Restore is Needed
      set_fact:
        needs_restore: "{{ peerlink_down | default(false) or (mlag_bonds | select('in', interface_data) | select('search', 'down') | list | length > 0) }}"
      when: mlag_present
